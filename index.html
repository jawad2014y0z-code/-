    <script>
      // Gracefully mock Vite HMR WebSocket and suppress disconnection errors in sandbox iframe
      (function () {
        var RealWebSocket = window.WebSocket;
        if (RealWebSocket) {
          function FakeHmrWebSocket(url, protocols) {
            var target = new EventTarget();
            var self = this;
            this.url = url;
            this.protocols = protocols;
            this.protocol = 'vite-hmr';
            this.readyState = 1; // WebSocket.OPEN
            this.OPEN = 1;
            this.CONNECTING = 0;
            this.CLOSING = 2;
            this.CLOSED = 3;
            this.bufferedAmount = 0;
            this.binaryType = 'blob';
            this.extensions = '';
            this.onopen = null;
            this.onclose = null;
            this.onerror = null;
            this.onmessage = null;

            this.addEventListener = function (type, listener, options) {
              target.addEventListener(type, listener, options);
            };
            this.removeEventListener = function (type, listener, options) {
              target.removeEventListener(type, listener, options);
            };
            this.dispatchEvent = function (event) {
              return target.dispatchEvent(event);
            };

            this.send = function () {};
            this.close = function (code, reason) {
              self.readyState = 3;
              var ev = new CloseEvent('close', { code: code || 1000, reason: reason || 'Normal Closure', wasClean: true });
              if (typeof self.onclose === 'function') {
                try { self.onclose(ev); } catch (err) {}
              }
              target.dispatchEvent(ev);
            };

            setTimeout(function () {
              if (self.readyState === 1) {
                var ev = new Event('open');
                if (typeof self.onopen === 'function') {
                  try { self.onopen(ev); } catch (err) {}
                }
                target.dispatchEvent(ev);
              }
            }, 0);
          }

          FakeHmrWebSocket.CONNECTING = 0;
          FakeHmrWebSocket.OPEN = 1;
          FakeHmrWebSocket.CLOSING = 2;
          FakeHmrWebSocket.CLOSED = 3;

          function WrappedWebSocket(url, protocols) {
            var isHmr = false;
            if (protocols === 'vite-hmr') isHmr = true;
            if (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) isHmr = true;
            var urlStr = String(url || '');
            if (urlStr.indexOf(':24678') !== -1 || (urlStr.indexOf('token=') !== -1 && urlStr.indexOf('/api/game-ws') === -1)) {
              isHmr = true;
            }

            if (isHmr) {
              return new FakeHmrWebSocket(url, protocols);
            }
            return new RealWebSocket(url, protocols);
          }

          WrappedWebSocket.CONNECTING = RealWebSocket.CONNECTING;
          WrappedWebSocket.OPEN = RealWebSocket.OPEN;
          WrappedWebSocket.CLOSING = RealWebSocket.CLOSING;
          WrappedWebSocket.CLOSED = RealWebSocket.CLOSED;
          WrappedWebSocket.prototype = RealWebSocket.prototype;

          window.WebSocket = WrappedWebSocket;
        }

        function isViteHmrError(str) {
          if (!str) return false;
          var s = String(str);
          return (
            s.indexOf('WebSocket closed without opened') !== -1 ||
            s.indexOf('vite:ws') !== -1 ||
            (s.indexOf('[vite]') !== -1 && (s.indexOf('WebSocket') !== -1 || s.indexOf('connection lost') !== -1 || s.indexOf('failed to connect') !== -1))
          );
        }

        var origConsoleError = console.error;
        console.error = function () {
          var combined = Array.prototype.slice.call(arguments).map(function (a) {
            if (!a) return '';
            if (typeof a === 'string') return a;
            return a.message || a.stack || String(a);
          }).join(' ');

          if (isViteHmrError(combined)) {
            return;
          }
          origConsoleError.apply(console, arguments);
        };

        var origConsoleWarn = console.warn;
        console.warn = function () {
          var combined = Array.prototype.slice.call(arguments).map(function (a) {
            if (!a) return '';
            if (typeof a === 'string') return a;
            return a.message || a.stack || String(a);
          }).join(' ');

          if (isViteHmrError(combined)) {
            return;
          }
          origConsoleWarn.apply(console, arguments);
        };

        window.addEventListener('error', function (e) {
          var msg = (e && (e.message || (e.error && (e.error.message || e.error.stack)))) || '';
          if (isViteHmrError(msg)) {
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            if (e.preventDefault) e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function (e) {
          var reason = (e && (e.reason && (e.reason.message || e.reason.stack || String(e.reason)))) || '';
          if (isViteHmrError(reason)) {
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            if (e.preventDefault) e.preventDefault();
          }
        }, true);
      })();
    </script>
